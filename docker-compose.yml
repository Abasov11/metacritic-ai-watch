services:
  web:
    build: .
    image: metacritic-ai-watch:latest
    container_name: metacritic-ai-watch
    restart: unless-stopped
    env_file: .env
    # Bound to loopback on purpose: nginx terminates TLS and proxies here.
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      # SQLite database and cached covers. Must be writable by uid 1000.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
