<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Metacritic AI Watch{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true"></span>
        Metacritic <span class="brand__dim">AI Watch</span>
      </a>
      <nav class="nav">
        <a class="nav__link" href="/">Каталог</a>
        <a class="nav__link" href="/monitor">Мониторинг</a>
        {% block headeraside %}{% endblock %}
      </nav>
    </div>
  </header>

  <main class="wrap" id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap">
      Данные — <a href="https://www.metacritic.com/game/" rel="noopener noreferrer">metacritic.com</a>.
      Резюме отзывов сгенерированы языковой моделью и могут содержать неточности.
    </div>
  </footer>
</body>
</html>
