[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metacritic-ai-watch"
version = "0.1.0"
description = "Hourly watcher for new Metacritic game releases with LLM review summaries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "yt-dlp>=2024.8.6",
    "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
# Local speech-to-text for videos without captions. Heavy (~800 MB with the model)
# and slow on CPU, so it is opt-in: install it and set YOUTUBE_WHISPER_ENABLED=1.
whisper = [
    "faster-whisper>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Templates and the stylesheet are part of the app, not build leftovers.
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to live in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
